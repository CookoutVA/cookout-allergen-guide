<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#bc102b"><meta name="description" content="Cook Out food allergen reference. Browse menu items or view items by allergen."><title>Cook Out | Food Allergen Guide</title><style>
:root{--red:#bf1230;--dark:#262126;--line:#eadcdd;--muted:#655b5f;--pink:#fff6f7}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f7f5f4;color:var(--dark)}header{background:var(--red);color:white;text-align:center;padding:24px 16px 22px;border-bottom:6px solid #900c22}header .logo{font-size:clamp(35px,8vw,54px);font-weight:1000;letter-spacing:-2px;font-style:italic;line-height:1;text-shadow:2px 3px #8e0b23}header .sub{letter-spacing:3px;font-weight:800;font-size:13px;margin-top:12px}main{max-width:760px;margin:auto;padding:22px 16px 50px}.panel{background:white;border:1px solid #eee4e4;border-radius:18px;padding:22px;box-shadow:0 3px 18px #3b142008}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.55}.intro{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.tile{min-height:112px;border:1.5px solid #ebcdd2;background:var(--pink);border-radius:13px;color:var(--dark);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:13px 4px;font-weight:750;font-size:13px}.tile:hover,.tile:focus-visible{border-color:var(--red);background:#ffe9ed;outline-offset:2px}.allergen-icon{width:34px;height:34px;color:var(--red);display:block}.allergen-icon svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.section-title{text-align:center;font-size:16px;font-weight:800;margin:6px 0 16px}.divider{height:1px;background:var(--line);margin:25px 0}.primary{background:var(--red);color:white;border:0;border-radius:12px;padding:17px 16px;font-size:16px;font-weight:800;width:100%;cursor:pointer}.primary:hover{background:#9c0c24}.notice{background:#f5f2f1;border-radius:12px;padding:16px;margin-top:22px;border-left:4px solid var(--red)}.notice h2{font-size:14px;margin:0 0 7px}.notice p{font-size:12px;margin:0;color:#51474b}.back{background:none;border:0;color:var(--red);font-weight:750;font-size:15px;padding:0;cursor:pointer;margin-bottom:19px}.search{width:100%;padding:15px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;margin:12px 0 20px}.item{padding:14px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.item-name{font-weight:800;font-size:15px;margin-bottom:9px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border-radius:6px;background:#fbe7ea;color:#a20d27;padding:5px 8px;font-size:12px;font-weight:750}.tag.may{background:#fff0d5;color:#805400}.tag.unknown{background:#eaeaea;color:#555}.cat{font-size:16px;color:var(--red);margin:22px 0 2px;font-weight:900;border-bottom:2px solid #f0dfe2;padding-bottom:7px}.meta{color:var(--muted);font-size:13px}.legend{font-size:12px;color:#62585b;line-height:1.6;margin:12px 0}.empty{padding:24px;text-align:center;color:#655}.footer{text-align:center;color:#777;font-size:11px;margin-top:22px}.pill{font-size:12px;font-weight:800;color:var(--red);background:#fff1f3;border-radius:999px;padding:5px 10px;display:inline-block;margin-bottom:12px}@media(max-width:360px){.grid{gap:7px}.tile{font-size:11px;min-height:98px}.allergen-icon{width:29px;height:29px}.panel{padding:16px}}@media(prefers-reduced-motion:no-preference){.tile,.primary{transition:background .15s,border-color .15s}}
 .allergy-alert{background:#fff1f2;border:2px solid #bc102b;border-radius:10px;padding:14px 12px;text-align:center;color:#9c1026;font-weight:800;font-size:1.05rem;margin:18px 0 20px}.official-logo{display:block;width:min(300px,75vw);height:auto;margin:0 auto 9px}header{padding:10px 16px 19px}.cat{scroll-margin-top:15px}</style></head><body><header><img class="official-logo" src="cookout-logo.jpeg" alt="Cook Out Fresh Hamburgers"><div class="sub">FOOD ALLERGEN GUIDE</div></header><main><div class="panel" id="app" aria-live="polite"></div><div class="footer">Allergen information based on the supplied menu reference. Verify before public release.</div></main><script>
let ITEMS=[];
let PUBLISHED_AT=null;
const ALLERGENS=["Milk", "Eggs", "Fish", "Shellfish", "Tree Nuts", "Peanuts", "Wheat", "Soy", "Sesame"];
const ICONS={"Milk": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 3h8M9 3v5l-3 4v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-8l-3-4V3\"/><path d=\"M6 13h12\"/></svg>", "Eggs": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 2C7 2 5 10 5 15a7 7 0 0 0 14 0c0-5-2-13-7-13Z\"/></svg>", "Fish": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 12c4-7 12-8 17 0-5 8-13 7-17 0ZM3 12l-2-5v10l2-5Z\"/><circle cx=\"15\" cy=\"11\" r=\"1\"/></svg>", "Shellfish": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 21C3 18 2 8 12 3c10 5 9 15 0 18ZM12 3v18M5 8l7 6 7-6M4 13l8 5 8-5\"/></svg>", "Tree Nuts": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3c-6 0-9 6-8 11 1 5 5 8 8 8s7-3 8-8C21 9 18 3 12 3Z\"/><path d=\"M12 4v17M8 8l4 3 4-3M7 15l5 3 5-3\"/></svg>", "Peanuts": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M10 2c-4 0-6 4-5 8-4 5-1 12 5 12 3 0 4-2 5-4 5-1 6-7 3-10 0-4-4-7-8-6Z\"/><path d=\"M6 10c3 1 6 1 9-2M8 15c3 0 5 1 7 3\"/></svg>", "Wheat": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 22V3M12 7C8 7 6 5 6 2c4 0 6 2 6 5ZM12 11C8 11 5 9 5 6c4 0 7 2 7 5ZM12 15C8 15 5 13 5 10c4 0 7 2 7 5ZM12 7c4 0 6-2 6-5-4 0-6 2-6 5ZM12 11c4 0 7-2 7-5-4 0-7 2-7 5ZM12 15c4 0 7-2 7-5-4 0-7 2-7 5Z\"/></svg>", "Soy": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 15c-1-6 6-12 15-11 2 10-5 17-12 16-2 0-3-2-3-5Z\"/><path d=\"M5 19c3-5 7-8 13-12M9 13c-1-2-1-4 0-6M12 11l5 1\"/></svg>", "Sesame": "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3c-4 5-5 8-5 11a5 5 0 0 0 10 0c0-3-1-6-5-11Z\"/><path d=\"M12 8v10\"/></svg>"};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>s.toLowerCase();
function tags(item){let out=item.contains.map(a=>`<span class="tag">Contains ${esc(a)}</span>`).join('')+item.mayContain.map(a=>`<span class="tag may">May contain ${esc(a)}</span>`).join('');return out||'<span class="tag unknown">Allergen information not provided — verify</span>'}
function itemHTML(item,selected){let t=selected?`<div class="tags">${item.contains.includes(selected)?`<span class="tag">Contains ${esc(selected)}</span>`:''}${item.mayContain.includes(selected)?`<span class="tag may">May contain ${esc(selected)}</span>`:''}</div>`:`<div class="tags">${tags(item)}</div>`;return `<article class="item"><div class="item-name">${esc(item.name)}</div>${t}</article>`}
function notice(){return `<aside class="notice"><h2>⚠ Important Allergy Information</h2><p>Food ingredients, suppliers and preparation procedures may change. Shared equipment and preparation areas can result in allergen cross-contact. “May contain” is different from a confirmed ingredient. Missing allergen information does not mean an item is allergen-free. If you have a food allergy, please speak with a manager before ordering.</p></aside>`}
function home(){app.innerHTML=`<h1 style="text-align:center">Welcome to Cook Out</h1><p class="intro" style="text-align:center">Find allergen information by selecting an allergen or browsing our menu.</p><p class="allergy-alert" role="note">If you have a food allergy, please notify us.</p><div class="section-title">SEARCH BY FOOD ALLERGEN</div><div class="grid">${ALLERGENS.map(n=>`<button class="tile" data-allergen="${esc(n)}"><span class="allergen-icon" aria-hidden="true">${ICONS[n]}</span><span>${esc(n)}</span></button>`).join('')}</div><div class="divider"></div><div class="section-title">OR BROWSE BY MENU ITEM</div><button class="primary" id="menuBtn">☰ &nbsp; View Full Menu &amp; Allergens →</button>${notice()}`;app.querySelectorAll('[data-allergen]').forEach(b=>b.onclick=()=>navigate('allergen',b.dataset.allergen));document.getElementById('menuBtn').onclick=()=>navigate('menu')}
function listing(type,a){let isAllergen=type==='allergen';let entries=isAllergen?ITEMS.filter(x=>x.contains.includes(a)||x.mayContain.includes(a)):ITEMS;let title=isAllergen?`${a} Allergen`:'Full Menu & Allergens';let note=isAllergen?'Items listed as containing or potentially containing this allergen in the provided spreadsheet.':'Select a menu item to review its listed allergens.';app.innerHTML=`<button class="back" id="back">← Back to Allergen Guide</button><div class="pill">${isAllergen?'ALLERGEN DETAILS':'MENU REFERENCE'}</div><h1>${esc(title)}</h1><p class="intro">${esc(note)}</p><div class="meta">${entries.length} menu ${entries.length===1?'item':'items'} ${isAllergen?'listed':'in reference'}</div><input class="search" id="search" type="search" placeholder="Search menu items..." aria-label="Search menu items"><div class="legend">🔴 Contains = listed ingredient allergen &nbsp; 🟡 May contain = potential presence indicated in source</div><div id="results"></div>${notice()}`;document.getElementById('back').onclick=()=>navigate('home');let search=document.getElementById('search');search.oninput=()=>renderResults(entries,isAllergen?a:null,search.value);renderResults(entries,isAllergen?a:null,'')}
function renderResults(entries,a,q){let filtered=entries.filter(x=>normalize(x.name).includes(normalize(q.trim())));let groups={};for(let x of filtered){(groups[x.category]??=[]).push(x)}let html=["Burgers & Chicken","Hot Dogs & BBQ","Sides & Wraps","Toppings, Sauces & Condiments","Shakes & Desserts"].filter(cat=>groups[cat]?.length).map(cat=>{let arr=groups[cat];return `<section><h2 class="cat">${esc(cat)}</h2>${arr.map(x=>itemHTML(x,a)).join('')}</section>`}).join('');if(!html)html=`<div class="empty">${a&&!entries.length?'No menu items are listed for this allergen in the supplied worksheet. This does not establish that menu items are free of this allergen.':'No matching menu items found.'}</div>`;document.getElementById('results').innerHTML=html}
function navigate(type='home',a=''){let hash=type==='home'?'':type==='menu'?'#menu':'#allergen/'+encodeURIComponent(a);if(location.hash!==hash){history.pushState(null,'',location.pathname+location.search+hash)}route();window.scrollTo(0,0)}
function route(){let h=decodeURIComponent(location.hash.slice(1));if(h==='menu')listing('menu');else if(h.startsWith('allergen/')&&ALLERGENS.includes(h.slice(9)))listing('allergen',h.slice(9));else home()}
window.addEventListener('popstate',route);window.addEventListener('hashchange',route);
async function loadPublishedData(){
 try {
  const response=await fetch('./menu-data.json',{cache:'no-store'});
  if(!response.ok)throw new Error('Data unavailable');
  const payload=await response.json();
  ITEMS=Array.isArray(payload)?payload:payload.items;
  PUBLISHED_AT=Array.isArray(payload)?null:payload.publishedAt;
  if(!Array.isArray(ITEMS))throw new Error('Invalid data format');
  const foot=document.querySelector('.footer');
  if(PUBLISHED_AT)foot.textContent='Allergen information last published: '+new Date(PUBLISHED_AT).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})+'. Please notify us if you have a food allergy.';
  route();
 }catch(error){app.innerHTML='<h1>Allergen guide temporarily unavailable</h1><p>Please notify a manager if you have a food allergy. Allergen information cannot be displayed at this time.</p>';}
}
loadPublishedData();
</script></body></html>
